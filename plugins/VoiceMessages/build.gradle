version = "1.1.11"
description = "Send Voice Messages"

aliucord {
    changelog.set(
        """
        # 1.1.11
        * Use Discord's themed bottom sheet for voice message selection
        * Add an option to disable selection and hold the microphone to record
        * Fix the "Please try again in a moment" issue when opening voice options
        # 1.1.10
        * Hide the voice message button when the channel does not allow attachments
        * Fix button not disappearing when attaching files
        # 1.1.9
        * Add ability to send audio files as voice messages
        # 1.1.8
        * Fix crash
        # 1.1.7
        * Add option to integrate button into chatbox
        * Fix button showing up in locked channels
        * Fix hex bar focusing
        # 1.1.6
        * Fix color picker
        * Add option for translucent button
        # 1.1.5
        * Fix crash
        * Remove the button when an attachment is added
        * Increase sampling rate on by default
        * Modernized Settings UI
        * Added color picker
        # 1.1.4
        * Restore and redesign the voice message button
        * Support replying with voice messages
        * Fix empty recordings on Android 7
        """.stripIndent(),
    )
}
