version = "1.0.1"
description = "Makes Discord search-history clearing persist across app restarts."

android {
    namespace = "com.github.yutaplug.searchhistoryfix"
}

aliucord {
    changelog.set(
        """
        # 1.0.1
        * Rewrite the plugin in Kotlin.
        * Persist new searches immediately as well as history clears.
        * Make history updates atomic to prevent concurrent changes from being lost.
        * Copy history lists before updating them to keep existing history unchanged.

        # 1.0.0
        * Make clearing search history persist immediately.
        """.stripIndent(),
    )
}
